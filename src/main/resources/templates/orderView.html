<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vibe hotel</title>
    <link href="/static/FAVICON.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

<body>
<h1>Order List</h1>
<hr>
<h3>List of orders</h3>

<table>
    <tr>
        <th>S/N</th>
        <th>Customer</th>
        <th>Phone roomNum</th>
        <th>Email</th>
        <th>Room no</th>

    </tr>
    <tr th:each="o:${oder}">
        <td th:text="${o.id}" >1</td>
        <td th:text="${o.name}" >Sarah</td>
        <td th:text="${o.phonenum}">07011775203</td>
        <td th:text="${o.email}">sarah@email</td>
        <td th:text="${o.roomnum}">202</td>
    </tr>
</table>

</body>
</html>
