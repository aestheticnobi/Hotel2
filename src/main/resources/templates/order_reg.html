<!DOCTYPE html>
<html lang="en"  xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="/static/FAVICON.png" rel="icon">
    <link rel="stylesheet" href="/static/CSS/Style.css">

</head>
<body>
<h1>Order Form</h1>
<hr>
<h3>Input correct data</h3>
<div>
<form th:action="@{/order/order1}" method="post" th:object="${order}">
    <label>Firstname</label><br>
    <input type="text" th:field="*{fname}">
<br>
    <label>Lastname </label><br>
    <input type="text" th:field="*{lname}">
    <br>
    <label>Email</label><br>
    <input type="text" th:field="*{email}">
    <br>

    <label>phone Number</label><br>
    <input type="number" th:field="*{phonenum}">
    <br>
    <label>Room Number</label><br>
    <input type="number" th:field="*{roomnum}">
<br>
    <input type="submit" name="submit">

</form>
</div>
</body>
</html>
