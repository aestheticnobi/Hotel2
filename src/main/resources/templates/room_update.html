<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room update</title>
    <link href="/static/FAVICON.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/CSS/Style.css">

</head>
<body>
<h1>Register</h1>
<hr>
<h3>Please input the details correctly</h3>

<div>

<form>
    <label>ID</label><br>
    <input type="number" th:field="*{id}">
    <br>
    <label>Room type</label><br>
    <input type="text" th:field="*{type}">
<br>
    <label>Room Number</label><br>
    <input type="number" th:field="*{roomNum}">
    <br>
    <label>Availability</label><br>
    <input type="text" th:field="*{isAvailable}">
    <br>

    <label>Price</label><br>
    <input type="number" th:field="*{price}">
    <br>

    <input type="submit" name="submit">

</form>
</div>
</body>
</html>
