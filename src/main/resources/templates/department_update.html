<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Department reg</title>
    <link href="/static/FAVICON.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/CSS/Style.css">

</head>
<body>
<h1>Register a new Department</h1>
<div>
<form th:action="@{/dept/reg}" method="post" th:object="${department}">
    <label>ID</label><br>
    <input type="roomNum" th:field="*{id}">
    <br>
    <label>Name</label><br>
    <input type="text" th:field="*{name}">
    <br>
    <input type="submit" name="submit">

</form>
</div>
</body>
</html>
