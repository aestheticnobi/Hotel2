<!DOCTYPE html>
<html lang="en" th:>
<head>
    <meta charset="UTF-8">
    <title>Vibe hotel</title>
    <link href="/static/FAVICON.png" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/CSS/Style.css">

</head>
<body>
<h1>Room View Page</h1>
<hr>
<h3>List of rooms</h3>
<table>
    <tr>
        <th>S/N</th>
        <th>Type of room</th>
        <th>Availability</th>
        <th>Room roomNum</th>
        <th>Price</th>

    </tr>
    <tr th:each="r:${room}">
        <td th:text="${r.id}" >1</td>
        <td th:text="${r.type}" >deluxe</td>
        <td th:text="${r.isAvailable}" >Available</td>
        <td th:text="${r.roomNum}"  >101</td>
        <td th:text="${r.price}"  >$4,000</td>
    </tr>
</table>

</body>
</html>
